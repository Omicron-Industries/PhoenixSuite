name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wiki dependencies
        working-directory: wiki
        run: pip install -r requirements.txt

      - name: Build wiki
        working-directory: wiki
        run: mkdocs build --strict

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp content.md _site/
          cp -r assets _site/
          cp -r wiki/site _site/wiki

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
